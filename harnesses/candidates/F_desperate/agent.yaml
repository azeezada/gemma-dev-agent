agent_class: SequentialAgent
name: last_stand
description: Desperate must-win run. Recon arms a frozen repro, three diverse strikes each followed by a deterministic survival guard, and a last will that always submits the best checkpoint.
sub_agents:
  - config_path: sub_agents/recon.yaml
  - config_path: sub_agents/strike_1.yaml
  - config_path: sub_agents/guard_1.yaml
  - config_path: sub_agents/strike_2.yaml
  - config_path: sub_agents/guard_2.yaml
  - config_path: sub_agents/strike_3.yaml
  - config_path: sub_agents/guard_3.yaml
  - config_path: sub_agents/last_will.yaml
